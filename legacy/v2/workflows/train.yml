name: train (fallback)

# The Databricks Workflow is the primary scheduler for retraining. This exists because
# `themepark.train` has no Databricks dependency, so the identical code runs on a runner
# with MLflow still pointed at the Databricks tracking server and registry.
#
# It is the escape hatch for the largest platform risk in this build: Prophet pulls
# cmdstan, and if that ever fails to install on Databricks serverless the weekly retrain
# moves here with no code change. Manual-only by default so the two schedulers cannot
# both promote a champion in the same week.
on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Comma-separated subset (blank = all four)"
        required: false
      no_register:
        description: "Score only; register nothing"
        type: boolean
        default: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install --quiet -r requirements.txt

      - name: Retrain, score and decide a champion
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          MLFLOW_TRACKING_URI: databricks
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python jobs/train_job.py --source sql \
            ${{ inputs.candidates && format('--candidates {0}', inputs.candidates) || '' }} \
            ${{ inputs.no_register && '--no-register' || '' }}
