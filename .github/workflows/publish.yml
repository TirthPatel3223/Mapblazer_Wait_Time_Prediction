name: publish

# Runs after the Databricks weekly job. Databricks cannot push to Supabase or GitHub
# Pages (no outbound internet on Free Edition), so the runner pulls the gold tables over
# the SQL warehouse and fans them out.
on:
  schedule:
    # Sunday 08:00 UTC -- two hours after the training job starts, which leaves ample
    # slack for a retry without needing the two schedules to be coupled.
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check whether credentials are configured
        id: creds
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$SUPABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish skipped::DATABRICKS_HOST / SUPABASE_URL are not set yet."
          fi

      - if: steps.creds.outputs.configured == 'true'
        run: pip install --quiet pandas pyarrow databricks-sql-connector databricks-sdk requests

      - name: Publish gold tables to Supabase
        if: steps.creds.outputs.configured == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python jobs/publish.py

      - name: Render the dashboard
        if: steps.creds.outputs.configured == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python jobs/build_dashboard.py --out site/index.html

      - uses: actions/configure-pages@v5
        if: steps.creds.outputs.configured == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.creds.outputs.configured == 'true'
        with:
          path: site
      - id: deployment
        if: steps.creds.outputs.configured == 'true'
        uses: actions/deploy-pages@v4
