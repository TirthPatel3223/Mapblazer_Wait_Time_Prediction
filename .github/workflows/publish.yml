name: publish

# Runs after the Databricks weekly job. Free Edition jobs have no outbound internet,
# so the runner pulls the gold _last tables over the SQL warehouse, pushes them to
# Supabase (atomically, via the publish_serving RPC), and deploys the dashboard.
on:
  schedule:
    # Sunday 08:00 UTC, two hours after the 06:00 training job.
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check whether credentials are configured
        id: creds
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$SUPABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish skipped::DATABRICKS_HOST / SUPABASE_URL secrets are not set."
          fi

      - if: steps.creds.outputs.configured == 'true'
        run: pip install --quiet pandas numpy pyarrow databricks-sql-connector requests

      - name: Fetch gold tables from the SQL warehouse
        if: steps.creds.outputs.configured == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        # One warehouse fetch feeds both the Supabase push and the dashboard build.
        run: python publish.py --no-push --save-parquet gold_snapshot

      - name: Push to Supabase
        id: supabase
        if: steps.creds.outputs.configured == 'true'
        # The dashboard does not depend on Supabase, so a failed push must not stop
        # the Pages deploy. The last step still fails the job so the push failure
        # alerts instead of passing silently.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python publish.py --from-parquet gold_snapshot

      - name: Render the dashboard
        if: steps.creds.outputs.configured == 'true'
        run: python dashboard.py --from-parquet gold_snapshot --out site/index.html

      - uses: actions/configure-pages@v5
        if: steps.creds.outputs.configured == 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.creds.outputs.configured == 'true'
        with:
          path: site
      - id: deployment
        if: steps.creds.outputs.configured == 'true'
        uses: actions/deploy-pages@v4

      - name: Fail the job if the Supabase push failed
        if: steps.creds.outputs.configured == 'true' && steps.supabase.outcome == 'failure'
        run: |
          echo "Supabase push failed; the dashboard still deployed. See the 'Push to Supabase' step."
          exit 1
