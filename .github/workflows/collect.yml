name: collect (fallback + keepalive)

# Primary ingestion runs on the VM that hosts the source database -- see deploy/ec2/.
# Pushing outbound from there means Postgres never has to be exposed to the internet.
#
# This workflow keeps two smaller jobs:
#
#   1. A daily Supabase heartbeat. A free Supabase project pauses after 7 days without a
#      database request, which would take the forecast API offline. The weekly publish
#      alone sits exactly on that boundary, so something has to touch it more often.
#
#   2. A fallback ingestion path. If PG_HOST is reachable from a runner it will also
#      collect, which is harmless alongside the VM collector because both are watermarked
#      off what actually landed in Databricks. If it is not reachable -- the expected
#      case -- it skips and only writes the heartbeat.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      drain:
        description: "Loop until caught up (backfill; only works if Postgres is reachable)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Decide what this run can do
        id: mode
        env:
          PG_HOST: ${{ secrets.PG_HOST }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$PG_HOST" ] && [ -n "$DATABRICKS_HOST" ]; then
            echo "ingest=true" >> "$GITHUB_OUTPUT"
          else
            echo "ingest=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Ingestion skipped::Postgres is not reachable from GitHub Actions. This is expected once the VM collector owns ingestion (deploy/ec2)."
          fi
          if [ -n "$SUPABASE_URL" ]; then
            echo "heartbeat=true" >> "$GITHUB_OUTPUT"
          else
            echo "heartbeat=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.mode.outputs.ingest == 'true' || steps.mode.outputs.heartbeat == 'true'
        run: pip install --quiet pandas pyarrow "psycopg[binary]" databricks-sdk databricks-sql-connector requests

      - name: Ingest
        if: steps.mode.outputs.ingest == 'true'
        env:
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_DATABASE: ${{ secrets.PG_DATABASE }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python jobs/collect.py ${{ inputs.drain && '--drain' || '' }}

      - name: Supabase keepalive
        # Runs when ingestion did not, so the serving project never idles out.
        if: steps.mode.outputs.heartbeat == 'true' && steps.mode.outputs.ingest != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from themepark.sources import Supabase

          Supabase().heartbeat(
              "keepalive",
              "success",
              "daily write so the free Supabase project does not pause; "
              "ingestion is handled by the VM collector",
          )
          print("heartbeat written")
          PY
