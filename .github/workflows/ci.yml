name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install --quiet -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        # The suite includes the failure-path proofs: a failed quality check must drop
        # _current and leave _last intact, the fallback must refresh the forecast with
        # the previous champion, and a first-run failure must change nothing.
        run: pytest -q

  deploy:
    # The job definition is deployed as code so the workspace can be rebuilt from this
    # repo. Skips cleanly when no workspace secrets are wired up: a missing secret is
    # an unconfigured environment, not a broken commit.
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether a Databricks workspace is configured
        id: workspace
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bundle deploy skipped::DATABRICKS_HOST / DATABRICKS_TOKEN are not set."
          fi

      - uses: databricks/setup-cli@main
        if: steps.workspace.outputs.configured == 'true'

      - name: Validate and deploy the asset bundle
        if: steps.workspace.outputs.configured == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate --target prod
          databricks bundle deploy --target prod
