# Databricks Asset Bundle: the weekly pipeline as one job with one task.
#
#   databricks bundle validate --target prod
#   databricks bundle deploy   --target prod
#   databricks bundle run themepark_weekly --target prod
#
# Free Edition notes: serverless only, no outbound internet from jobs (Supabase and the
# dashboard are pushed by publish.py from GitHub Actions or a laptop), and dependency
# install time dominates the run, so the single task carries the single environment.

bundle:
  name: themepark

variables:
  notification_email:
    description: Address that receives job-failure mail
    default: tirthpatel3223@gmail.com

targets:
  prod:
    # Deliberately no `mode:`. `production` requires a run_as service principal that a
    # single-user free workspace does not have; `development` force-pauses schedules.
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}
    resources:
      jobs:
        themepark_weekly:
          schedule:
            # Sunday 06:00 UTC; the publish workflow on GitHub runs at 08:00, leaving
            # slack for the job without coupling the two schedules.
            quartz_cron_expression: "0 0 6 ? * SUN"
            timezone_id: UTC
            pause_status: UNPAUSED

resources:
  jobs:
    themepark_weekly:
      name: themepark-weekly-pipeline

      email_notifications:
        on_failure:
          - ${var.notification_email}
        no_alert_for_skipped_runs: true

      max_concurrent_runs: 1

      tasks:
        - task_key: weekly_pipeline
          description: >-
            Bronze -> silver -> train -> KPIs -> gold -> quality checks -> promote
            current to last -> champion pointer. On any failure the task drops the
            _current tables, re-scores the week with the previous champion, and fails.
          spark_python_task:
            python_file: ./pipeline.py
          environment_key: ml
          # No retry. A failure has already run the in-task fallback; retrying a
          # correct refusal only burns the free-tier compute quota.
          max_retries: 0

      environments:
        - environment_key: ml
          spec:
            client: "3"
            dependencies:
              - holidays>=0.40
              - xgboost>=2.0,<4.0
              - prophet>=1.1.5
