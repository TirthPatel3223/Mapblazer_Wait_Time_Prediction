[project]
name = "themepark-pipeline"
version = "3.0.0"
description = "Theme-park wait-time pipeline: one Databricks task, one file"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
# Explicit, because the working tree also holds the superseded v1/v2 code and the local
# test suite, neither of which is published.
include = ["pipeline.py", "publish.py", "dashboard.py", "deploy/ec2/ingest.py", "tests/**/*.py"]
# tests/ is gitignored but still worth linting locally; the include list above is what
# actually bounds the check.
respect-gitignore = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
